<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>카드내비 AI</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap');
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root{
      --bg:#f7f8fb; --ink:#101319; --muted:#6d7482; --line:#e8edf4; --blue:#3182f6;
      --blue2:#1b64da; --card:#fff; --soft:#f1f5fb; --green:#00a661; --red:#e5484d;
    }
    body{
      font-family:'Inter',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans KR",sans-serif;
      background: radial-gradient(circle at 50% -10%, #eaf3ff 0, #f7f8fb 330px);
      color:var(--ink); letter-spacing:-.02em;
    }
    .app{max-width:430px; min-height:100dvh; margin:0 auto; padding:18px 16px 104px;}
    .top{position:sticky; top:0; z-index:20; display:flex; justify-content:space-between; align-items:center; padding:8px 0 14px; backdrop-filter:blur(16px);}
    .brand{font-size:21px; font-weight:900; letter-spacing:-.06em; display:flex; align-items:center; gap:8px;}
    .brand:before{content:''; width:26px; height:26px; border-radius:9px; background:linear-gradient(135deg,var(--blue),#8bb8ff); box-shadow:0 8px 22px rgba(49,130,246,.25);}
    .step{font-size:12px; font-weight:800; color:var(--blue2); background:#eaf3ff; padding:7px 11px; border-radius:999px;}
    .progress{height:5px; background:#e6edf7; border-radius:999px; overflow:hidden; margin:0 0 18px;}
    .bar{height:100%; width:33.3%; background:linear-gradient(90deg,var(--blue),#6aa8ff); border-radius:999px; transition:.28s cubic-bezier(.2,.8,.2,1);}
    .screen{display:none;} .screen.active{display:block; animation:enter .2s ease;}
    @keyframes enter{from{opacity:0; transform:translateY(10px)}to{opacity:1; transform:translateY(0)}}
    .hero{padding:24px 4px 16px;}
    .eyebrow{display:inline-flex; align-items:center; gap:6px; color:var(--blue2); background:#eaf3ff; padding:7px 10px; border-radius:999px; font-size:12px; font-weight:850; margin-bottom:14px;}
    h1{font-size:34px; line-height:1.04; letter-spacing:-.075em; font-weight:900; margin-bottom:12px;}
    h2{font-size:22px; line-height:1.2; letter-spacing:-.055em; font-weight:900; margin-bottom:6px;}
    .sub{color:var(--muted); font-size:15px; line-height:1.58; letter-spacing:-.025em;}
    .panel{background:rgba(255,255,255,.86); border:1px solid rgba(226,232,240,.85); border-radius:26px; padding:18px; margin-top:12px; box-shadow:0 16px 40px rgba(28,39,60,.07); backdrop-filter:blur(18px);}
    .field{margin-top:16px; display:grid; gap:8px;}
    label{font-size:13px; font-weight:800; color:#4b5565;}
    input,select{width:100%; height:54px; border:1px solid #e1e8f2; border-radius:18px; padding:0 15px; font-size:17px; font-weight:700; background:#fff; color:var(--ink); outline:none; box-shadow:0 1px 0 rgba(16,19,25,.03);}
    select{appearance:none; background-image:linear-gradient(45deg,transparent 50%,#8a94a6 50%),linear-gradient(135deg,#8a94a6 50%,transparent 50%); background-position:calc(100% - 18px) 23px,calc(100% - 13px) 23px; background-size:5px 5px,5px 5px; background-repeat:no-repeat; padding-right:34px; white-space:nowrap; text-overflow:ellipsis;}
    input:focus,select:focus{border-color:var(--blue); box-shadow:0 0 0 4px rgba(49,130,246,.12);}
    .chips{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:10px;}
    .chip{min-height:68px; border:1px solid #e4ebf5; background:#fff; color:#222936; border-radius:20px; padding:13px; text-align:left; font-size:15px; font-weight:900; cursor:pointer; box-shadow:0 6px 18px rgba(30,41,59,.04);}
    .chip small{display:block; color:#7d8796; font-size:12px; font-weight:750; margin-top:3px; letter-spacing:-.02em;}
    .chip.active{border-color:#b8d7ff; background:linear-gradient(180deg,#eff6ff,#fff); color:#0b57c2; box-shadow:inset 0 0 0 1px rgba(49,130,246,.18),0 10px 24px rgba(49,130,246,.10);} .chip.active small{color:#3972c6;}
    .card-pick{position:relative; display:grid; grid-template-columns:.72fr 1.28fr; gap:8px; padding:38px 12px 12px; margin-top:10px; border:1px solid #e7edf5; border-radius:22px; background:#fbfdff;}
    .card-pick:before{content:'보유 카드'; position:absolute; left:14px; top:13px; font-size:12px; font-weight:900; color:#7a8494;}
    .card-pick select{height:48px; font-size:14px; border-radius:16px; padding-left:12px; padding-right:28px;}
    .remove{position:absolute; right:10px; top:8px; width:32px; height:32px; padding:0; border-radius:999px; background:#fff1f2; color:#e5484d; font-size:17px; box-shadow:none;}
    .small-btn{width:100%; margin-top:10px; padding:14px; border-radius:18px; font-size:15px; background:#edf6ff; color:#0b57c2;}
    .actions{position:fixed; left:50%; bottom:0; z-index:30; width:min(430px,100%); transform:translateX(-50%); display:grid; grid-template-columns:1fr 1.7fr; gap:9px; padding:12px 16px calc(14px + env(safe-area-inset-bottom)); background:linear-gradient(180deg,rgba(247,248,251,0),rgba(247,248,251,.96) 28%,#f7f8fb);}
    .actions.single{grid-template-columns:1fr;}
    button{border:0; border-radius:19px; padding:16px; background:var(--blue); color:white; font-size:16px; font-weight:900; cursor:pointer; box-shadow:0 10px 24px rgba(49,130,246,.22);}
    button.secondary{background:#fff; color:#475467; border:1px solid #e5ebf3; box-shadow:0 8px 18px rgba(20,30,45,.06);} button:disabled{opacity:.55; cursor:not-allowed;}
    .summary{display:grid; gap:10px; margin-top:12px;}
    .metric{background:#f8fbff; border:1px solid #e7edf5; border-radius:20px; padding:15px;}
    .metric small{color:#697386; font-size:12px; font-weight:850; display:block; margin-bottom:4px;}.metric strong{font-size:21px; font-weight:900; letter-spacing:-.05em;}
    .plan{border:1px solid #e7edf5; border-radius:22px; padding:16px; background:#fff; margin-top:10px; box-shadow:0 8px 22px rgba(30,41,59,.04);}
    .plan-top{display:flex; justify-content:space-between; gap:10px; align-items:flex-start;}.badge{white-space:nowrap; font-size:11px; font-weight:900; padding:7px 9px; border-radius:999px; background:#eafaf1; color:#087443;}
    .money{font-size:28px; font-weight:950; letter-spacing:-.06em; margin-top:8px;}.reason{color:#4b5565; font-size:14px; line-height:1.55; margin-top:5px;}.tags{display:flex; flex-wrap:wrap; gap:6px; margin-top:10px;}.tag{padding:6px 9px; border-radius:999px; background:#f1f5f9; color:#475569; font-size:12px; font-weight:850;}
    .loading{display:none; align-items:center; gap:8px; color:#596273; font-size:14px; margin-top:12px;}.loading.on{display:flex}.dot{width:8px;height:8px;border-radius:50%;background:var(--blue);animation:pulse .8s infinite alternate}@keyframes pulse{to{transform:scale(1.5);opacity:.5}}
    .error{display:none; margin-top:12px; padding:13px; border-radius:17px; background:#fff1f2; color:#be123c; font-weight:800; font-size:14px; line-height:1.45;}.error.on{display:block}
  </style>
</head>
<body>
  <main class="app">
    <div class="top"><div class="brand">카드내비 AI</div><div class="step" id="stepText">1 / 3</div></div>
    <div class="progress"><div class="bar" id="bar"></div></div>

    <section class="screen active" data-step="1">
      <div class="hero"><div class="eyebrow">AI 카드 전략</div><h1>카드 몇 장만<br>고르면<br>AI가 나눠줘요</h1><p class="sub">월평균 사용금액과 보유 카드만 선택하면 gpt5.6-Luna가 카드별 사용 금액과 역할을 추천합니다.</p></div>
      <div class="panel"><h2>월평균 소비</h2>
        <div class="field"><label>한 달 평균 카드 사용금액</label><input id="monthlySpend" type="number" inputmode="numeric" value="1200000"></div>
        <div class="field"><label>주 소비 패턴</label><select id="pattern"><option>식비·카페가 많음</option><option selected>온라인쇼핑·구독이 많음</option><option>교통·통신이 많음</option><option>골고루 씀</option></select></div>
        <div class="field"><label>추천 방식</label><div class="chips" id="priorityChips"><button class="chip active" data-value="실사용 편의">실사용 편의<small>귀찮지 않게</small></button><button class="chip" data-value="혜택 극대화">혜택 극대화<small>피킹률 우선</small></button><button class="chip" data-value="카드 수 최소화">카드 수 최소화<small>1~2장만</small></button><button class="chip" data-value="실적 안정성">실적 안정성<small>월 기준 관리</small></button></div></div>
        <div class="actions single"><button onclick="nextStep()">다음</button></div>
      </div>
    </section>

    <section class="screen" data-step="2">
      <div class="panel"><h2>내 카드 선택</h2><p class="sub">카드사 → 카드명 순서로 선택합니다. 긴 텍스트 입력 없이 보유 카드만 추가하세요.</p>
        <div id="cardRows"></div>
        <button class="small-btn" onclick="addCardRow()">카드 추가</button>
        <div class="field"><label>몇 장까지 나눠 쓸까요?</label><select id="maxCards"><option>1장</option><option selected>2장</option><option>3장</option><option>제한 없음</option></select></div>
        <div class="loading" id="loading"><span class="dot"></span>gpt5.6-Luna가 카드 조합을 분석 중</div>
        <div class="error" id="errorBox"></div>
        <div class="actions"><button class="secondary" onclick="prevStep()">이전</button><button id="recommendBtn" onclick="requestAI()">AI 전략 보기</button></div>
      </div>
    </section>

    <section class="screen" data-step="3">
      <div class="hero"><div class="eyebrow">AI 추천 결과</div><h1 id="headline">카드 전략을<br>만들었어요</h1><p class="sub" id="guide">추천 이유와 월 사용 배분을 함께 확인하세요.</p></div>
      <div class="panel"><h2>요약</h2><div class="summary"><div class="metric"><small>월평균 사용</small><strong id="sumSpend">-</strong></div><div class="metric"><small>주력 카드</small><strong id="mainCard">-</strong></div><div class="metric"><small>전략 한 줄</small><strong id="oneLine">-</strong></div></div></div>
      <div class="panel"><h2>카드별 역할</h2><div id="plans"></div><div class="actions"><button class="secondary" onclick="prevStep()">수정</button><button onclick="requestAI()">다시 추천</button></div></div>
    </section>
  </main>

  <script>
    const issuerCards = {
      '신한카드': ['신한 Deep Dream','신한 Mr.Life','신한 처음','신한카드 Edu','신한카드 The BEST-F','신한카드 Puzzle','신한카드 Shopping','카카오뱅크 신한카드','신한카드 Air One','신한카드 B.Big'],
      '현대카드': ['현대카드 M','현대카드 ZERO Edition3','현대카드 the Green Edition2','현대카드 the Red Edition5','현대카드 the Orange','현대카드 네이버','현대카드 애플페이','현대카드 대한항공카드 030','현대카드 Z family','현대카드 Z work'],
      '삼성카드': ['삼성 iD ON','삼성 iD SIMPLE','삼성 iD PET','삼성 iD NOMAD','삼성카드 taptap O','삼성카드 taptap DRIVE','삼성카드 & MILEAGE PLATINUM','삼성카드 아메리칸 익스프레스 블루','삼성카드 디지털프라자','삼성카드 국민행복'],
      'KB국민카드': ['국민 탄탄대로 올쇼핑','KB국민 톡톡D','KB국민 청춘대로 톡톡','KB국민 다담카드','KB국민 My WE:SH','KB국민 굿데이카드','KB국민 Easy pick','KB국민 Easy all','KB국민 알파원카드','KB국민 가온올림카드'],
      '롯데카드': ['롯데 LOCA 365','롯데 LIKIT all','롯데 LIKIT FUN','롯데 LOCA LIKIT','롯데 LOCA MONEY','롯데 LOCA CLASSIC','롯데 I’m WONDERFUL','롯데 TELLO SE','롯데카드 Trip to 로카','롯데카드 디지로카 London'],
      '우리카드': ['우리 카드의정석 EVERY 1','우리 카드의정석 POINT','우리 DA@카드의정석','우리 NU Uniq','우리 NU Blanc','우리 알뜰교통카드','우리 쿠키체크','우리 카드의정석 Shopping','우리 카드의정석 UniMile','우리 카드의정석 Premium'],
      '하나카드': ['하나 MULTI Any','하나 MULTI Young','하나 원더카드 FREE','하나 원더카드 DAILY','하나 원더카드 LIVING','하나 Club SK','하나 1Q Daily+','하나 트래블로그','하나 SMART ANY','하나 모두의 쇼핑'],
      'NH농협카드': ['NH 올바른 FLEX','NH 올바른 POINT UP','NH 올바른 LIFE','NH zgm.고향으로','NH zgm.the pay','NH 별다줄카드','NH 올바른 NEW HAVE','NH 올원 파이카드','NH 라이언 치즈 체크','NH채움카드'],
      'BC카드': ['BC 바로 클리어 플러스','BC 바로 리워드 플러스','BC 바로 에어 플러스','BC 바로 K-패스','BC 시발카드','BC 페이북 머니 체크','BC 글로벌카드','BC 그린카드','BC TOP포인트카드','BC BLISS.7'],
      'IBK기업은행': ['IBK Oil & Life','IBK 일상의 기쁨카드','IBK 무민카드','IBK 참 좋은 친구카드','IBK BLISS.5','IBK DC히어로즈','IBK 쇼핑앤조이','IBK I-ALL','IBK 나라사랑카드','IBK 알뜰교통카드'],
      '카카오뱅크': ['카카오뱅크 신한카드','카카오뱅크 KB국민카드','카카오뱅크 삼성카드','카카오뱅크 롯데카드','카카오뱅크 프렌즈 체크카드'],
      '토스뱅크': ['토스뱅크 체크카드','토스뱅크 모임카드','토스뱅크 하나카드 Wide','토스뱅크 KB국민카드','토스뱅크 신용카드']
    };
    const issuers = Object.keys(issuerCards);
    const fmt = n => new Intl.NumberFormat('ko-KR').format(Math.max(0, Math.round(Number(n)||0))) + '원';
    let step = 1, priority = '실사용 편의';

    document.querySelectorAll('.chip').forEach(chip => chip.addEventListener('click', () => { chip.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('active')); chip.classList.add('active'); priority = chip.dataset.value; }));
    function nextStep(){ step=Math.min(3, step+1); updateStep(); }
    function prevStep(){ step=Math.max(1, step-1); updateStep(); }
    function updateStep(){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active', Number(s.dataset.step)===step)); document.getElementById('stepText').textContent=`${step} / 3`; document.getElementById('bar').style.width=`${step*33.333}%`; window.scrollTo({top:0, behavior:'smooth'}); }
    function issuerOptions(selected=''){ return issuers.map(i=>`<option ${i===selected?'selected':''}>${i}</option>`).join(''); }
    function cardOptions(issuer, selected=''){ return (issuerCards[issuer] || []).map(c=>`<option ${c===selected?'selected':''}>${c}</option>`).join(''); }
    function refreshCardSelect(issuerSelect){
      const row = issuerSelect.closest('.card-pick');
      const cardSelect = row.querySelector('.card-select');
      cardSelect.innerHTML = cardOptions(issuerSelect.value);
    }
    function addCardRow(defaultIssuer, defaultCard){
      const count=document.querySelectorAll('.card-select').length;
      const issuer = defaultIssuer || issuers[count % issuers.length];
      const card = defaultCard || issuerCards[issuer][0];
      const row=document.createElement('div');
      row.className='card-pick';
      row.innerHTML=`<select class="issuer-select" onchange="refreshCardSelect(this)">${issuerOptions(issuer)}</select><select class="card-select">${cardOptions(issuer, card)}</select><button class="remove" onclick="this.parentElement.remove()">×</button>`;
      document.getElementById('cardRows').appendChild(row);
    }
    addCardRow('현대카드','현대카드 the Orange'); addCardRow('신한카드','신한 Deep Dream'); addCardRow('삼성카드','삼성카드 & MILEAGE PLATINUM');
    function selectedCards(){ return [...document.querySelectorAll('.card-pick')].map(row=>`${row.querySelector('.issuer-select').value} ${row.querySelector('.card-select').value}`).filter((v,i,a)=>v && a.indexOf(v)===i); }
    function setLoading(on){ document.getElementById('loading').classList.toggle('on', on); document.getElementById('recommendBtn').disabled=on; }
    function showError(msg){ const el=document.getElementById('errorBox'); el.textContent=msg; el.classList.toggle('on', !!msg); }

    async function requestAI(){
      showError(''); setLoading(true);
      const payload = { monthlySpend:Number(document.getElementById('monthlySpend').value||0), pattern:document.getElementById('pattern').value, priority, maxCards:document.getElementById('maxCards').value, unknownMode:'AI가 일반 카드명 기준으로 추론', ownedCards:selectedCards() };
      try {
        if (!payload.ownedCards.length) throw new Error('카드를 1개 이상 선택해 주세요.');
        const res = await fetch('/api/recommend', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'AI 추천 생성 실패');
        render(data, payload); step = 3; updateStep();
      } catch (e) { showError(e.message); }
      finally { setLoading(false); }
    }
    function render(data, payload){
      const main = data.recommendations?.[0];
      document.getElementById('sumSpend').textContent = fmt(payload.monthlySpend);
      document.getElementById('mainCard').textContent = main?.card || '-';
      document.getElementById('oneLine').textContent = data.summary || '-';
      document.getElementById('headline').innerHTML = main ? `${main.card}<br>주력 추천` : '추천 결과';
      document.getElementById('guide').textContent = data.rationale || 'AI가 카드별 역할을 정리했습니다.';
      document.getElementById('plans').innerHTML = (data.recommendations || []).map((r,i)=>`<article class="plan"><div class="plan-top"><strong>${i+1}. ${r.card}</strong><span class="badge">${r.role || '추천'}</span></div><div class="money">${fmt(r.monthlyAmount)}</div><p class="reason">${r.reason || ''}</p><div class="tags">${(r.categories||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div></article>`).join('');
    }
  </script>
</body>
</html>
