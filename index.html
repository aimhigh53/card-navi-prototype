<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>카드내비 AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif; background:#f3f6fb; color:#101318; }
    .app { max-width:430px; min-height:100dvh; margin:0 auto; padding:18px 16px 28px; }
    .top { display:flex; justify-content:space-between; align-items:center; margin-bottom:14px; }
    .brand { font-weight:950; font-size:22px; letter-spacing:-.055em; }
    .step { padding:7px 10px; border-radius:999px; background:#eef2ff; color:#4353d6; font-weight:900; font-size:12px; }
    .progress { height:6px; border-radius:999px; background:#e5ebf3; overflow:hidden; margin-bottom:16px; }
    .bar { height:100%; width:33.3%; background:#101318; transition:.22s; }
    .screen { display:none; } .screen.active { display:block; animation:enter .18s ease; }
    @keyframes enter { from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:translateY(0)} }
    .hero,.panel { background:#fff; border:1px solid #e4e9f1; border-radius:28px; box-shadow:0 18px 48px rgba(15,23,42,.07); }
    .hero { padding:24px; margin-bottom:12px; }
    .panel { padding:18px; margin-top:12px; }
    .eyebrow { color:#5267f5; font-weight:950; font-size:13px; margin-bottom:10px; }
    h1 { font-size:34px; line-height:1.04; letter-spacing:-.065em; margin-bottom:12px; }
    h2 { font-size:24px; letter-spacing:-.045em; margin-bottom:8px; }
    .sub { color:#667085; font-size:15px; line-height:1.55; }
    .field { margin-top:16px; display:grid; gap:8px; }
    label { font-weight:850; color:#596273; font-size:13px; }
    input,select { width:100%; border:1px solid #dbe2ed; border-radius:17px; padding:15px 14px; font-size:17px; background:#fff; color:#101318; outline:none; }
    input:focus,select:focus { border-color:#5367f5; box-shadow:0 0 0 4px rgba(83,103,245,.12); }
    .chips { display:grid; grid-template-columns:1fr 1fr; gap:9px; margin-top:10px; }
    .chip { border:1px solid #e0e7f0; background:#fbfcff; color:#273142; border-radius:17px; padding:13px 12px; text-align:left; font-weight:900; cursor:pointer; }
    .chip small { display:block; color:#7a8494; font-weight:750; margin-top:2px; }
    .chip.active { background:#101318; color:#fff; border-color:#101318; } .chip.active small { color:#cbd5e1; }
    .card-pick { display:grid; grid-template-columns:1fr 44px; gap:8px; margin-top:10px; }
    .remove { padding:0; border-radius:15px; background:#f1f5f9; color:#334155; }
    .small-btn { padding:11px 13px; border-radius:999px; font-size:13px; background:#eef2ff; color:#3345b8; }
    .actions { display:grid; grid-template-columns:1fr 1.55fr; gap:9px; margin-top:18px; } .actions.single { grid-template-columns:1fr; }
    button { border:0; border-radius:18px; padding:15px 16px; background:#101318; color:white; font-size:16px; font-weight:950; cursor:pointer; }
    button.secondary { background:#eef2ff; color:#3345b8; }
    button:disabled { opacity:.55; cursor:not-allowed; }
    .summary { display:grid; gap:10px; margin-top:12px; }
    .metric { background:#f8fafc; border:1px solid #edf1f6; border-radius:19px; padding:15px; }
    .metric small { color:#687385; font-weight:850; display:block; margin-bottom:4px; }
    .metric strong { font-size:21px; letter-spacing:-.04em; }
    .plan { border:1px solid #e7edf5; border-radius:21px; padding:16px; background:#fff; margin-top:10px; }
    .plan-top { display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
    .badge { white-space:nowrap; font-size:12px; font-weight:950; padding:7px 10px; border-radius:999px; background:#ecfdf5; color:#047857; }
    .money { font-size:28px; font-weight:950; letter-spacing:-.05em; margin-top:8px; }
    .reason { color:#414b5a; font-size:14px; line-height:1.55; margin-top:4px; }
    .tags { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
    .tag { padding:6px 9px; border-radius:999px; background:#f1f5f9; color:#475569; font-size:12px; font-weight:850; }
    .loading { display:none; align-items:center; gap:8px; color:#596273; font-size:14px; margin-top:12px; }
    .loading.on { display:flex; }
    .dot { width:8px; height:8px; border-radius:50%; background:#5367f5; animation:pulse .8s infinite alternate; }
    @keyframes pulse { to { transform:scale(1.5); opacity:.5; } }
    .error { display:none; margin-top:12px; padding:13px; border-radius:16px; background:#fff1f2; color:#be123c; font-weight:800; font-size:14px; line-height:1.45; }
    .error.on { display:block; }
  </style>
</head>
<body>
  <main class="app">
    <div class="top"><div class="brand">카드내비 AI</div><div class="step" id="stepText">1 / 3</div></div>
    <div class="progress"><div class="bar" id="bar"></div></div>

    <section class="screen active" data-step="1">
      <div class="hero"><div class="eyebrow">AI 카드 전략</div><h1>가진 카드와<br>월 소비만으로<br>전략을 짜요</h1><p class="sub">카드별 현재 사용액은 묻지 않습니다. 월평균 소비와 소유 카드만 받아서 gpt5.6-Luna가 배분 전략을 만듭니다.</p></div>
      <div class="panel"><h2>월평균 소비</h2>
        <div class="field"><label>한 달 평균 카드 사용금액</label><input id="monthlySpend" type="number" inputmode="numeric" value="1200000"></div>
        <div class="field"><label>주 소비 패턴</label><select id="pattern"><option>식비·카페가 많음</option><option selected>온라인쇼핑·구독이 많음</option><option>교통·통신이 많음</option><option>골고루 씀</option></select></div>
        <div class="field"><label>추천 방식</label><div class="chips" id="priorityChips"><button class="chip active" data-value="실사용 편의">실사용 편의<small>귀찮지 않게</small></button><button class="chip" data-value="혜택 극대화">혜택 극대화<small>피킹률 우선</small></button><button class="chip" data-value="카드 수 최소화">카드 수 최소화<small>1~2장만</small></button><button class="chip" data-value="실적 안정성">실적 안정성<small>월 기준 관리</small></button></div></div>
        <div class="actions single"><button onclick="nextStep()">다음</button></div>
      </div>
    </section>

    <section class="screen" data-step="2">
      <div class="panel"><h2>내 카드 선택</h2><p class="sub">직접 입력하지 않고 선택합니다. 필요한 만큼 추가해서 소유 카드만 고르세요.</p>
        <div id="cardRows"></div>
        <button class="small-btn" onclick="addCardRow()">카드 추가</button>
        <div class="field"><label>몇 장까지 나눠 쓸까요?</label><select id="maxCards"><option>1장</option><option selected>2장</option><option>3장</option><option>제한 없음</option></select></div>
        <div class="field"><label>카드 정보를 모를 때</label><select id="unknownMode"><option selected>AI가 일반 카드명 기준으로 추론</option><option>확실한 카드만 추천</option></select></div>
        <div class="loading" id="loading"><span class="dot"></span>gpt5.6-Luna가 카드 조합을 분석 중</div>
        <div class="error" id="errorBox"></div>
        <div class="actions"><button class="secondary" onclick="prevStep()">이전</button><button id="recommendBtn" onclick="requestAI()">AI 전략 보기</button></div>
      </div>
    </section>

    <section class="screen" data-step="3">
      <div class="hero"><div class="eyebrow">AI 추천 결과</div><h1 id="headline">카드 전략을<br>만들었어요</h1><p class="sub" id="guide">추천 이유와 월 사용 배분을 함께 확인하세요.</p></div>
      <div class="panel"><h2>요약</h2><div class="summary"><div class="metric"><small>월평균 사용</small><strong id="sumSpend">-</strong></div><div class="metric"><small>주력 카드</small><strong id="mainCard">-</strong></div><div class="metric"><small>전략 한 줄</small><strong id="oneLine">-</strong></div></div></div>
      <div class="panel"><h2>카드별 역할</h2><div id="plans"></div><div class="actions"><button class="secondary" onclick="prevStep()">수정</button><button onclick="requestAI()">다시 추천</button></div></div>
    </section>
  </main>

  <script>
    const cards = [
      '신한 Deep Dream','신한 Mr.Life','신한 처음','현대카드 M','현대카드 ZERO','현대카드 the Green','현대카드 the Orange','국민 탄탄대로','KB국민 톡톡D','삼성 iD ON','삼성카드 taptap O','삼성카드 마일리지','롯데 LIKIT','우리 카드의정석','하나 MULTI Any','NH 올바른 FLEX','카카오뱅크 신한카드','토스뱅크 체크카드'
    ];
    const fmt = n => new Intl.NumberFormat('ko-KR').format(Math.max(0, Math.round(Number(n)||0))) + '원';
    let step = 1, priority = '실사용 편의';

    document.querySelectorAll('.chip').forEach(chip => chip.addEventListener('click', () => { chip.parentElement.querySelectorAll('.chip').forEach(c=>c.classList.remove('active')); chip.classList.add('active'); priority = chip.dataset.value; }));
    function nextStep(){ step=Math.min(3, step+1); updateStep(); }
    function prevStep(){ step=Math.max(1, step-1); updateStep(); }
    function updateStep(){ document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('active', Number(s.dataset.step)===step)); document.getElementById('stepText').textContent=`${step} / 3`; document.getElementById('bar').style.width=`${step*33.333}%`; window.scrollTo({top:0, behavior:'smooth'}); }
    function cardOptions(selected=''){ return cards.map(c=>`<option ${c===selected?'selected':''}>${c}</option>`).join(''); }
    function addCardRow(selected){ const count=document.querySelectorAll('.card-select').length; const row=document.createElement('div'); row.className='card-pick'; row.innerHTML=`<select class="card-select">${cardOptions(selected || cards[count % cards.length])}</select><button class="remove" onclick="this.parentElement.remove()">×</button>`; document.getElementById('cardRows').appendChild(row); }
    ['현대카드 the Orange','현대카드 네이버','삼성카드 마일리지'].forEach(addCardRow);
    function selectedCards(){ return [...document.querySelectorAll('.card-select')].map(s=>s.value).filter((v,i,a)=>v && a.indexOf(v)===i); }
    function setLoading(on){ document.getElementById('loading').classList.toggle('on', on); document.getElementById('recommendBtn').disabled=on; }
    function showError(msg){ const el=document.getElementById('errorBox'); el.textContent=msg; el.classList.toggle('on', !!msg); }

    async function requestAI(){
      showError(''); setLoading(true);
      const payload = { monthlySpend:Number(document.getElementById('monthlySpend').value||0), pattern:document.getElementById('pattern').value, priority, maxCards:document.getElementById('maxCards').value, unknownMode:document.getElementById('unknownMode').value, ownedCards:selectedCards() };
      try {
        if (!payload.ownedCards.length) throw new Error('카드를 1개 이상 선택해 주세요.');
        const res = await fetch('/api/recommend', { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload) });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'AI 추천 생성 실패');
        render(data, payload); step = 3; updateStep();
      } catch (e) { showError(e.message); }
      finally { setLoading(false); }
    }
    function render(data, payload){
      const main = data.recommendations?.[0];
      document.getElementById('sumSpend').textContent = fmt(payload.monthlySpend);
      document.getElementById('mainCard').textContent = main?.card || '-';
      document.getElementById('oneLine').textContent = data.summary || '-';
      document.getElementById('headline').innerHTML = main ? `${main.card}<br>주력 추천` : '추천 결과';
      document.getElementById('guide').textContent = data.rationale || 'AI가 카드별 역할을 정리했습니다.';
      document.getElementById('plans').innerHTML = (data.recommendations || []).map((r,i)=>`<article class="plan"><div class="plan-top"><strong>${i+1}. ${r.card}</strong><span class="badge">${r.role || '추천'}</span></div><div class="money">${fmt(r.monthlyAmount)}</div><p class="reason">${r.reason || ''}</p><div class="tags">${(r.categories||[]).map(t=>`<span class="tag">${t}</span>`).join('')}</div></article>`).join('');
    }
  </script>
</body>
</html>
